appId: com.changjiai.chats
productName: ChatHub
copyright: Copyright © 2026 changji-ai
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # ws 的可选原生加速模块：macOS universal 合并时冲突，且 ws 无它们也能正常工作
  - "!node_modules/bufferutil/**"
  - "!node_modules/utf-8-validate/**"
asar: true
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  category: public.app-category.social-networking
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Network
  maintainer: changji-ai
publish:
  provider: github
  owner: changji-ai
  repo: chats
